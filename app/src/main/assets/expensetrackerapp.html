<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        body {
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        
        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slide-in-from-bottom {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-in {
            animation: fade-in 0.5s ease-out;
        }
        
        .slide-in-from-bottom-10 {
            animation: slide-in-from-bottom 0.5s ease-out;
        }
        
        /* Enhanced gradient backgrounds */
        .gradient-blue {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        
        .gradient-purple {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        
        /* Force white text on gradient cards in all modes - highest priority */
        .gradient-blue,
        .gradient-blue *,
        .gradient-blue p,
        .gradient-blue h1,
        .gradient-blue h2,
        .gradient-blue h3,
        .gradient-blue h4,
        .gradient-blue span,
        .gradient-blue div,
        .gradient-purple,
        .gradient-purple *,
        .gradient-purple p,
        .gradient-purple h1,
        .gradient-purple h2,
        .gradient-purple h3,
        .gradient-purple h4,
        .gradient-purple span,
        .gradient-purple div {
            color: white !important;
        }
        
        /* Override dark mode text colors on gradient cards - even more specific */
        .dark .gradient-blue,
        .dark .gradient-blue *,
        .dark .gradient-blue p,
        .dark .gradient-blue h1,
        .dark .gradient-blue h2,
        .dark .gradient-blue h3,
        .dark .gradient-blue h4,
        .dark .gradient-blue span,
        .dark .gradient-blue div,
        .dark .gradient-purple,
        .dark .gradient-purple *,
        .dark .gradient-purple p,
        .dark .gradient-purple h1,
        .dark .gradient-purple h2,
        .dark .gradient-purple h3,
        .dark .gradient-purple h4,
        .dark .gradient-purple span,
        .dark .gradient-purple div {
            color: white !important;
        }
        
        /* Override any Tailwind text color classes on gradient cards */
        .gradient-blue.text-slate-900,
        .gradient-blue.dark\:text-white,
        .gradient-blue.text-black,
        .gradient-purple.text-slate-900,
        .gradient-purple.dark\:text-white,
        .gradient-purple.text-black {
            color: white !important;
        }
        
        /* Ultra-specific override for Total Spent card text */
        .gradient-blue h2,
        .gradient-blue h2.text-white,
        .gradient-blue h2.dark\:text-white,
        .gradient-blue p.text-white,
        .gradient-blue p.dark\:text-white,
        .gradient-purple h3,
        .gradient-purple h3.text-white,
        .gradient-purple h3.dark\:text-white,
        .gradient-purple p.text-white,
        .gradient-purple p.dark\:text-white {
            color: white !important;
        }
        
        /* Smooth transitions */
        * {
            transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 200ms;
        }
        
        /* Custom scrollbar for webkit */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 3px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }
        
        /* Glass morphism effect */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .dark .glass {
            background: rgba(0, 0, 0, 0.7);
        }
        
        /* Pulse animation for active states */
        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(59, 130, 246, 0);
            }
        }
        
        .pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        /* Shimmer effect for loading states */
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }
        
        .shimmer {
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }
    </style>
    
    <script>
        // Configure Tailwind dark mode
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#3b82f6',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        // Icon component factory
        const Icon = ({ children, size = 24, strokeWidth = 2, ...props }) => (
            <svg 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth={strokeWidth}
                strokeLinecap="round" 
                strokeLinejoin="round"
                {...props}
            >
                {children}
            </svg>
        );
        
        // Icon components
        const Home = (props) => (
            <Icon {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>
        );
        const BarChart3 = (props) => (
            <Icon {...props}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></Icon>
        );
        const Target = (props) => (
            <Icon {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Icon>
        );
        const Settings = (props) => (
            <Icon {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>
        );
        const Plus = (props) => (
            <Icon {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>
        );
        const ChevronLeft = (props) => (
            <Icon {...props}><polyline points="15 18 9 12 15 6"/></Icon>
        );
        const Calendar = (props) => (
            <Icon {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></Icon>
        );
        const Tag = (props) => (
            <Icon {...props}><path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l10-10A1 1 0 0 0 22 11V2Z"/><path d="M7 7h.01"/></Icon>
        );
        const PieIcon = (props) => (
            <Icon {...props}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></Icon>
        );
        const TrendingUp = (props) => (
            <Icon {...props}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Icon>
        );
        const ArrowRight = (props) => (
            <Icon {...props}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></Icon>
        );
        const Filter = (props) => (
            <Icon {...props}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></Icon>
        );
        const Trash2 = (props) => (
            <Icon {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></Icon>
        );
        const Download = (props) => (
            <Icon {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></Icon>
        );
        const Moon = (props) => (
            <Icon {...props}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></Icon>
        );
        const Sun = (props) => (
            <Icon {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></Icon>
        );
        const LayoutGrid = (props) => (
            <Icon {...props}><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></Icon>
        );
        const Edit = (props) => (
            <Icon {...props}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></Icon>
        );
        const X = (props) => (
            <Icon {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>
        );

        // --- UI Components ---

        const Card = ({ children, className = "" }) => {
            // If gradient class is present, don't apply default text colors
            const hasGradient = className.includes('gradient-blue') || className.includes('gradient-purple');
            const textClass = hasGradient ? '' : 'text-slate-900 dark:text-white';
            return (
                <div className={`bg-white dark:bg-[#151515] rounded-[2rem] p-6 border border-slate-100 dark:border-white/5 shadow-lg dark:shadow-black/50 ${textClass} ${className}`}>
                    {children}
                </div>
            );
        };

        const NavButton = ({ icon: Icon, active, onClick, label }) => (
            <button 
                onClick={onClick}
                className={`flex flex-col items-center gap-1 transition-all duration-300 relative ${
                    active ? 'text-blue-500 scale-110' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-200'
                }`}
            >
                {active && (
                    <div className="absolute -top-1 left-1/2 transform -translate-x-1/2 w-1 h-1 bg-blue-500 rounded-full"></div>
                )}
                <Icon size={24} strokeWidth={active ? 2.5 : 2} />
                <span className="text-[10px] font-bold uppercase tracking-tighter">{label}</span>
            </button>
        );

        const CategoryIcon = ({ category, size = "md" }) => {
            const categories = {
                Food: { icon: "🍔", color: "bg-orange-500/10", text: "text-orange-500", border: "border-orange-500/20" },
                Transport: { icon: "🚗", color: "bg-blue-500/10", text: "text-blue-500", border: "border-blue-500/20" },
                Shopping: { icon: "🛍️", color: "bg-blue-500/10", text: "text-blue-500", border: "border-blue-500/20" },
                Bills: { icon: "📜", color: "bg-red-500/10", text: "text-red-500", border: "border-red-500/20" },
                Entertainment: { icon: "🍿", color: "bg-amber-500/10", text: "text-amber-500", border: "border-amber-500/20" },
                Others: { icon: "✨", color: "bg-slate-500/10", text: "text-slate-500", border: "border-slate-500/20" },
            };
            
            const config = categories[category] || { icon: "📦", color: "bg-slate-500/10", text: "text-slate-500", border: "border-slate-500/20" };
            const sizeClasses = size === "sm" ? "w-10 h-10 text-lg" : "w-12 h-12 text-xl";
            
            return (
                <div className={`${sizeClasses} ${config.color} ${config.text} ${config.border} border rounded-2xl flex items-center justify-center shadow-sm transition-transform hover:scale-110`}>
                    {config.icon}
                </div>
            );
        };

        // --- Main Application ---

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [darkMode, setDarkMode] = useState(window.matchMedia('(prefers-color-scheme: dark)').matches);
            const [authMode, setAuthMode] = useState('login'); // login | signup | forgot
            const [currentUser, setCurrentUser] = useState(null);
            const [authError, setAuthError] = useState('');
            const [showAbout, setShowAbout] = useState(false);
            // Start empty; data comes from SQLite per-user once logged in
            const [expenses, setExpenses] = useState([]);
            const [editingExpense, setEditingExpense] = useState(null);
            const [showEditModal, setShowEditModal] = useState(false);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            // Load current session (Android SharedPreferences)
            useEffect(() => {
                try {
                    if (window.Android && typeof window.Android.getCurrentUser === 'function') {
                        const raw = window.Android.getCurrentUser();
                        const parsed = raw ? JSON.parse(raw) : null;
                        if (parsed && parsed.id) {
                            setCurrentUser(parsed);
                        }
                    }
                } catch (err) {
                    console.log('getCurrentUser failed', err);
                }
            }, []);

            // Load expenses from Android SQLite (if running inside WebView)
            const loadExpenses = () => {
                try {
                    if (currentUser && window.Android && typeof window.Android.getExpenses === 'function') {
                        const raw = window.Android.getExpenses();
                        const parsed = JSON.parse(raw || '[]');
                        if (Array.isArray(parsed)) {
                            setExpenses(parsed);
                        }
                    }
                } catch (err) {
                    console.log('Android DB load failed', err);
                }
            };

            useEffect(() => {
                loadExpenses();
            }, [currentUser]);

            const handleDeleteExpense = (expenseId) => {
                if (!confirm('Are you sure to delete it?')) return;
                try {
                    if (window.Android && typeof window.Android.deleteExpense === 'function') {
                        const deleted = window.Android.deleteExpense(expenseId);
                        if (deleted) {
                            loadExpenses();
                        }
                    }
                } catch (err) {
                    console.log('Delete failed', err);
                }
            };

            const handleEditExpense = (expense) => {
                setEditingExpense(expense);
                setShowEditModal(true);
            };

            const handleSaveEdit = (updatedExpense) => {
                try {
                    if (window.Android && typeof window.Android.updateExpense === 'function') {
                        const updated = window.Android.updateExpense(
                            updatedExpense.id,
                            updatedExpense.category,
                            updatedExpense.amount,
                            updatedExpense.note,
                            updatedExpense.date
                        );
                        if (updated) {
                            loadExpenses();
                            setShowEditModal(false);
                            setEditingExpense(null);
                        }
                    }
                } catch (err) {
                    console.log('Update failed', err);
                }
            };

            const handleLogout = () => {
                try {
                    if (window.Android && typeof window.Android.logout === 'function') {
                        window.Android.logout();
                    }
                } catch (err) {
                    console.log('logout failed', err);
                }
                setExpenses([]);
                setCurrentUser(null);
                setAuthMode('login');
                setActiveTab('home');
            };

            // --- Auth Screens ---
            const AuthShell = ({ title, subtitle, children }) => (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 via-white to-slate-50 dark:from-black dark:via-[#0a0a0a] dark:to-black font-sans text-slate-900 flex justify-center p-0 md:p-12 transition-colors duration-500">
                    <div className="w-full max-w-md bg-white dark:bg-black md:rounded-[3.5rem] md:shadow-2xl md:border-[10px] md:border-[#1a1a1a] overflow-hidden relative flex flex-col h-screen md:h-[844px]">
                        <main className="flex-1 overflow-y-auto px-6 pt-14 pb-12 scrollbar-hide custom-scrollbar">
                            <div className="space-y-8 animate-in fade-in duration-500">
                                <div className="text-center space-y-2">
                                    <div className="w-16 h-16 mx-auto rounded-3xl gradient-blue flex items-center justify-center shadow-xl shadow-blue-500/30">
                                        <span className="text-2xl font-black text-white">$</span>
                                    </div>
                                    <h1 className="text-3xl font-black tracking-tight dark:text-white">{title}</h1>
                                    <p className="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">{subtitle}</p>
                                </div>
                                {authError && (
                                    <div className="bg-rose-50 dark:bg-rose-500/10 border border-rose-200 dark:border-rose-500/20 text-rose-600 dark:text-rose-400 rounded-2xl p-4 text-xs font-bold">
                                        {authError}
                                    </div>
                                )}
                                {children}
                            </div>
                        </main>
                    </div>
                </div>
            );

            const LoginScreen = () => {
                const [username, setUsername] = useState('');
                const [password, setPassword] = useState('');
                return (
                    <AuthShell title="Welcome Back" subtitle="Log in to continue">
                        <div className="space-y-4">
                            <div className="space-y-3">
                                <input
                                    type="text"
                                    placeholder="Username"
                                    className="w-full bg-slate-50 dark:bg-white/5 border border-slate-100 dark:border-white/5 rounded-2xl px-5 py-4 font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500/20 dark:text-white"
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                />
                                <input
                                    type="password"
                                    placeholder="Password"
                                    className="w-full bg-slate-50 dark:bg-white/5 border border-slate-100 dark:border-white/5 rounded-2xl px-5 py-4 font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500/20 dark:text-white"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                />
                                <button
                                    onClick={() => {
                                        setAuthError('');
                                        try {
                                            const raw = window.Android?.login?.(username, password);
                                            const res = raw ? JSON.parse(raw) : { ok: false, error: 'Login failed.' };
                                            if (!res.ok) return setAuthError(res.error || 'Login failed.');
                                            setCurrentUser(res.user);
                                        } catch (err) {
                                            console.log(err);
                                            setAuthError('Login failed.');
                                        }
                                    }}
                                    className="w-full gradient-blue text-white font-bold py-4 rounded-[2rem] shadow-xl shadow-blue-500/30 text-base transition-all hover:scale-[1.01] active:scale-95"
                                >
                                    Log In
                                </button>
                            </div>
                            <div className="flex justify-between items-center">
                                <button
                                    className="text-xs font-bold text-blue-500 dark:text-blue-400"
                                    onClick={() => { setAuthError(''); setAuthMode('forgot'); }}
                                >
                                    Forgot password?
                                </button>
                                <button
                                    className="text-xs font-bold text-slate-500 dark:text-slate-400"
                                    onClick={() => { setAuthError(''); setAuthMode('signup'); }}
                                >
                                    Create account
                                </button>
                            </div>
                        </div>
                    </AuthShell>
                );
            };

            const SignupScreen = () => {
                const [username, setUsername] = useState('');
                const [password, setPassword] = useState('');
                const [pet, setPet] = useState('');
                return (
                    <AuthShell title="Create Account" subtitle="Sign up to save your data">
                        <div className="space-y-4">
                            <input
                                type="text"
                                placeholder="Username"
                                className="w-full bg-slate-50 dark:bg-white/5 border border-slate-100 dark:border-white/5 rounded-2xl px-5 py-4 font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500/20 dark:text-white"
                                value={username}
                                onChange={(e) => setUsername(e.target.value)}
                            />
                            <input
                                type="password"
                                placeholder="Password"
                                className="w-full bg-slate-50 dark:bg-white/5 border border-slate-100 dark:border-white/5 rounded-2xl px-5 py-4 font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500/20 dark:text-white"
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                            />
                            <div className="bg-slate-50 dark:bg-white/5 border border-slate-100 dark:border-white/5 rounded-2xl px-5 py-4">
                                <p className="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">
                                    Security Question
                                </p>
                                <p className="text-xs font-bold dark:text-white mb-3">What is your first pet name?</p>
                                <p className="text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-3 leading-snug">
                                    Important: You will need this answer to reset your password later using <span className="font-black">Forgot password</span>.
                                </p>
                                <input
                                    type="text"
                                    placeholder="Answer"

                    } catch (err) {
                        console.log('Delete budget failed', err);

                                const isOver = percentage >= 100;

                                        const ok = window.Android.exportCsv();

                                        alert('Export is only available in the Android app.');
                                    }
                                } catch (err) {
                                    console.log('exportCsv failed', err);
                                    alert('Export failed.');
                                }

                        >

                                    <p className="font-bold dark:text-white">Export CSV</p>

                                </div>

                                <div className="text-left">
                                    <p className="font-bold dark:text-white">About</p>
                                    <p className="text-xs text-slate-400 dark:text-slate-500 mt-0.5">App version & info</p>
                                </div>
                            </div>
                            <ArrowRight size={18} className="text-slate-400" />
                        </button>
                        
                        <button

                            onClick={() => {
                                const ok = confirm('Clear all expenses? This cannot be undone.');
                                if (!ok) return;
                                try {
                                    if (window.Android && typeof window.Android.clearExpenses === 'function') {
                                        const cleared = window.Android.clearExpenses();
                                        if (cleared) {
                                            loadExpenses();
                                            setActiveTab('home');

                                    console.log('Android DB clear failed', err);
                                }
                            }}
                        >
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 rounded-2xl bg-rose-500/10 text-rose-500 flex items-center justify-center">
                                    <Trash2 size={22} />

                                <div className="text-left">
                                    <p className="font-bold text-rose-500">Clear Data</p>
                                    <p className="text-xs text-slate-400 dark:text-slate-500 mt-0.5">Delete all expenses</p>
                                </div>
                            </div>
                            <ArrowRight size={18} className="text-rose-400" />
                        </button>
                    </Card>
                    
                    <div className="text-center pt-8">
                        <p className="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">
                            Expense Tracker v1.0
                        </p>
                    </div>
                </div>
            );

                if (authMode === 'signup') return <SignupScreen />;
                if (authMode === 'forgot') return <ForgotPasswordScreen />;
                return <LoginScreen />;

                <div className={`${darkMode ? 'dark' : ''}`}>
                    <div className="min-h-screen bg-gradient-to-br from-slate-50 via-white to-slate-50 dark:from-black dark:via-[#0a0a0a] dark:to-black font-sans text-slate-900 flex justify-center p-0 md:p-12 transition-colors duration-500">
                        <div className="w-full max-w-md bg-white dark:bg-black md:rounded-[3.5rem] md:shadow-2xl md:border-[10px] md:border-[#1a1a1a] overflow-hidden relative flex flex-col h-screen md:h-[844px]">
                            
                            {/* About Modal */}

                                <div className="absolute inset-0 z-[100] flex items-center justify-center px-6">

                                    <div className="relative w-full bg-white dark:bg-[#0a0a0a] rounded-3xl p-6 border border-slate-100 dark:border-white/10 shadow-2xl">
                                        <div className="flex items-start justify-between gap-4">
                                            <div>
                                                <p className="text-xs font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest">About</p>

                            {showEditModal && <EditExpenseModal />}

                            {/* Nav */}
                            <nav className="glass border-t border-slate-100 dark:border-white/5 px-6 py-6 flex justify-between items-center absolute bottom-0 left-0 right-0 z-50 backdrop-blur-2xl">
                                <NavButton icon={Home} label="Home" active={activeTab === 'home'} onClick={() => setActiveTab('home')} />
                                <NavButton icon={BarChart3} label="Charts" active={activeTab === 'analytics'} onClick={() => setActiveTab('analytics')} />
                                
                                <button 
                                    onClick={() => setActiveTab('add')}
                                    className="w-16 h-16 gradient-blue text-white rounded-[1.8rem] flex items-center justify-center shadow-xl shadow-blue-500/40 hover:shadow-2xl hover:shadow-blue-500/50 active:scale-90 transition-all -mt-12 border-4 border-white dark:border-black hover:scale-110 z-10 relative pulse-glow"
                                >
                                    <Plus size={28} strokeWidth={3} />
                                </button>

                                <NavButton icon={Target} label="Budget" active={activeTab === 'budget'} onClick={() => setActiveTab('budget')} />
                                <NavButton icon={Settings} label="Prefs" active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} />
                            </nav>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
